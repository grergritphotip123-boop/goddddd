name: Build Psychic Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - run: chmod +x gradlew
    - run: ./gradlew build
    - uses: actions/upload-artifact@v4
      with:
        name: PsychicMod-1.20.1
        path: build/libs/*.jar
